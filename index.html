<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="author" content="fsaritome">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnage Circuit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Chakra+Petch:wght@400;600;700&display=swap">
<style>
/* Layout: 16:9 arena screen with all menus (title, garage, results) as steel panels over it; touch pad below on phones. Single dark look by choice. */
:root{
  --bg:#0c0d0f;
  --panel:#16181b;
  --steel:#25292e;
  --line:#3a3f46;
  --ink:#ece6d8;
  --dim:#8d9096;
  --haz:#f2b705;
  --blood:#c8161d;
  --ok:#62c26c;
  --display:"Black Ops One",Impact,"Arial Black",sans-serif;
  --body:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0}
[hidden]{display:none!important}
body{
  background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-sizing:border-box;padding-inline:16px;padding-block:10px;overflow:hidden;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
.cab{width:min(100%, calc((100dvh - 64px) * 16 / 9));display:flex;flex-direction:column;gap:8px}
.screen{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;overflow:hidden;background:#000;border:2px solid var(--line);border-radius:6px}
.screen canvas{display:block;width:100%;height:100%}
.overlay{position:absolute;inset:0;z-index:2;overflow:auto;background:rgba(8,9,10,.84);display:flex;justify-content:center;align-items:flex-start;padding:clamp(10px,2.4vw,28px);box-sizing:border-box}
.overlay > div{margin-block:auto;width:100%;max-width:880px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--dim);font-size:13px;flex-wrap:wrap}
.foot .row{display:flex;gap:8px}

h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.02em}
h1{font-size:clamp(34px,7.5vw,84px);line-height:.92;color:var(--ink);text-shadow:4px 4px 0 var(--blood)}
h2{font-size:clamp(22px,3.6vw,36px)}
h3{font-size:clamp(14px,1.8vw,18px);color:var(--haz);margin-bottom:8px}
p{margin:0}
.eyebrow{font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.lede{color:var(--dim);font-size:clamp(14px,1.8vw,17px);max-width:46ch;line-height:1.45}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.title{display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.hazard{height:10px;width:100%;background:repeating-linear-gradient(-45deg,var(--haz) 0 12px,#111 12px 24px);border-radius:2px}

button{
  font-family:var(--body);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;
  background:var(--steel);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:.7em 1.1em;cursor:pointer;
}
button:hover:not(:disabled),button:focus-visible{border-color:var(--haz);outline:none;color:#fff}
button:focus-visible{box-shadow:0 0 0 2px var(--haz)}
button:disabled{opacity:.4;cursor:not-allowed}
button.go{background:var(--haz);color:#111;border-color:var(--haz)}
button.go:hover,button.go:focus-visible{background:#ffcc2e;color:#111}
.foot button{padding:.35em .7em;font-size:11px}

.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:14px;color:var(--dim)}
.keys b{color:var(--ink);font-weight:600}

.g-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.cash{font-family:var(--display);font-size:clamp(26px,4vw,40px);color:var(--ok);font-variant-numeric:tabular-nums}
.g-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;min-width:0}
.up{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding-block:9px;border-top:1px solid var(--line)}
.up:first-of-type{border-top:0}
.up .nm{font-weight:700}
.up .ds{grid-column:1;color:var(--dim);font-size:13px}
.up button{grid-row:1 / span 3;grid-column:2;min-width:118px}
.pips{display:flex;gap:4px;grid-column:1}
.pips i{width:16px;height:6px;background:var(--steel);border:1px solid var(--line)}
.pips i.on{background:var(--haz);border-color:var(--haz)}
.meter{height:8px;background:var(--steel);border:1px solid var(--line);border-radius:2px;overflow:hidden;grid-column:1}
.meter > span{display:block;height:100%;background:var(--ok)}
.meter.bad > span{background:var(--blood)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th{text-align:left;color:var(--dim);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:4px 6px;border-bottom:1px solid var(--line)}
td{padding:6px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right}
tr.me td{color:var(--haz);font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px;vertical-align:-1px;border:1px solid rgba(255,255,255,.3)}
.big-place{font-family:var(--display);font-size:clamp(40px,8vw,80px);line-height:1;color:var(--haz)}
.dead{color:var(--blood)}

.seg-wrap{display:flex;flex-direction:column;gap:6px}
.seg{display:flex;flex-wrap:wrap;gap:0}
.seg button{border-radius:0;margin-left:-1px;padding:.55em .9em;font-size:12px}
.seg button:first-child{border-radius:3px 0 0 3px;margin-left:0}
.seg button:last-child{border-radius:0 3px 3px 0}
.seg button[aria-pressed="true"]{background:var(--haz);color:#111;border-color:var(--haz)}
.build{margin-left:8px;padding:2px 6px;border-radius:2px;background:var(--blood);color:#fff;font-size:11px;letter-spacing:.12em}
.byline{color:var(--dim);font-size:13px;letter-spacing:.06em}
.byline b{color:var(--ink);font-weight:700}
.credits dl{display:grid;grid-template-columns:auto 1fr;gap:8px 20px;margin:0;font-size:clamp(14px,1.8vw,17px)}
.credits dt{color:var(--dim);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding-top:3px}
.credits dd{margin:0;font-weight:700;min-width:0;overflow-wrap:anywhere}
.pad{display:none;justify-content:space-between;gap:10px}
.pad .grp{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pad button{width:60px;height:52px;padding:0;font-size:11px;touch-action:none}
.pad button.on{background:var(--haz);color:#111}
@media (pointer:coarse){
  .cab{width:min(100%, calc((100dvh - 150px) * 16 / 9))}
  .pad{display:flex}
  .keys{display:none}
}
</style>
</head>
<body>

<div class="cab">
  <div class="screen">
    <canvas id="game" width="960" height="540" aria-label="Race view"></canvas>
    <div class="overlay" id="overlay"><div id="panel"></div></div>
  </div>
  <div class="foot">
    <span>Carnage Circuit · a game by fsaritome <b class="build" id="build" hidden>DEV BUILD</b></span>
    <span class="row"><button id="bMute">Sound: on</button><button id="bPause">Pause</button></span>
  </div>
  <div class="pad" aria-label="Touch controls">
    <div class="grp"><button data-key="ArrowLeft">◀</button><button data-key="ArrowRight">▶</button></div>
    <div class="grp">
      <button data-key="KeyQ">Swap</button><button data-key="KeyE">Special</button>
      <button data-key="KeyX">Mine</button><button data-key="ShiftLeft">Nitro</button><button data-key="Space">Fire</button>
      <button data-key="ArrowDown">Brake</button><button data-key="ArrowUp">Gas</button>
    </div>
  </div>
</div>

<script>
(() => {
  const VW = 960, VH = 540, HALF = 62, WALL = HALF + 66, SP = 8, LAPS = 4, RACES = 6;
  const HAZ = '#f2b705', BLOOD = '#c8161d', INK = '#ece6d8';
  const $ = id => document.getElementById(id);
  // The dev preview lives under /dev/ on the same site, so give it its own save slots
  const CHANNEL = location.pathname.includes('/dev/') ? '-dev' : '';
  if (CHANNEL) { document.title += ' (dev)'; $('build').hidden = false; }
  const cv = $('game'), ctx = cv.getContext('2d');
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const wrap = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
  const hyp = Math.hypot;
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const money = n => '$' + Math.round(n).toLocaleString('en-US');

  let dpr = 1;
  function resize() { dpr = Math.min(2, window.devicePixelRatio || 1); cv.width = VW * dpr; cv.height = VH * dpr; }
  resize(); addEventListener('resize', resize);

  // ================= tracks =================
  const TRACKS = [
    { name: 'Dust Bowl', ground: '#b48f5a', speck: ['#a07c4a', '#c7a26b', '#94703f', '#bf9a62'], shoulder: '#9c7a4a', road: '#3a3836', decor: 'desert',
      pts: [[1000, 440], [1700, 400], [2500, 500], [2650, 1100], [2500, 1700], [1500, 1820], [550, 1700], [380, 1100], [500, 520]] },
    { name: 'Scrapyard Hook', ground: '#5f5a50', speck: ['#534e45', '#6c665a', '#4a453d', '#77705f'], shoulder: '#4f4a42', road: '#2f2f31', decor: 'scrap',
      pts: [[800, 380], [1350, 360], [1720, 820], [2100, 400], [2600, 520], [2680, 1200], [2250, 1820], [1350, 1880], [1020, 1320], [560, 1620], [340, 1000], [420, 450]] },
    { name: 'Bone Canyon', ground: '#8a4f38', speck: ['#7a4430', '#99593f', '#6c3b29', '#a3634a'], shoulder: '#74412e', road: '#363234', decor: 'rock',
      pts: [[850, 300], [1300, 320], [1520, 700], [1150, 1020], [1520, 1320], [2200, 1180], [2700, 1300], [2700, 1900], [1800, 2020], [850, 1920], [360, 1350], [400, 600]] },
  ];
  const built = {};

  function buildTrack(ti) {
    if (built[ti]) return built[ti];
    const T = TRACKS[ti], P = T.pts, n = P.length;
    const cr = (a, b, c, d, t) => { const t2 = t * t, t3 = t2 * t; return 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3); };
    const dense = [];
    for (let i = 0; i < n; i++) {
      const p0 = P[(i - 1 + n) % n], p1 = P[i], p2 = P[(i + 1) % n], p3 = P[(i + 2) % n];
      for (let t = 0; t < 1; t += 0.01) dense.push({ x: cr(p0[0], p1[0], p2[0], p3[0], t), y: cr(p0[1], p1[1], p2[1], p3[1], t) });
    }
    const cum = [0];
    for (let i = 1; i <= dense.length; i++) { const a = dense[i - 1], b = dense[i % dense.length]; cum.push(cum[i - 1] + hyp(b.x - a.x, b.y - a.y)); }
    const L = cum[cum.length - 1], N = Math.floor(L / SP), pts = [];
    let j = 0;
    for (let k = 0; k < N; k++) {
      const tgt = k * L / N;
      while (cum[j + 1] < tgt) j++;
      const a = dense[j], b = dense[(j + 1) % dense.length], f = (tgt - cum[j]) / (cum[j + 1] - cum[j] || 1);
      pts.push({ x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f });
    }
    for (let k = 0; k < N; k++) {
      const a = pts[(k - 1 + N) % N], b = pts[(k + 1) % N], ang = Math.atan2(b.y - a.y, b.x - a.x);
      pts[k].a = ang; pts[k].nx = -Math.sin(ang); pts[k].ny = Math.cos(ang);
    }
    let minx = 1e9, miny = 1e9, maxx = 0, maxy = 0;
    for (const p of pts) { minx = Math.min(minx, p.x); miny = Math.min(miny, p.y); maxx = Math.max(maxx, p.x); maxy = Math.max(maxy, p.y); }
    const WW = Math.ceil(maxx + 420), WH = Math.ceil(maxy + 420);

    const world = document.createElement('canvas'); world.width = WW; world.height = WH;
    const w = world.getContext('2d');
    w.fillStyle = T.ground; w.fillRect(0, 0, WW, WH);
    for (let i = 0; i < 32000; i++) { w.fillStyle = pick(T.speck); const s = rand(1, 4); w.fillRect(rand(0, WW), rand(0, WH), s, s); }
    const path = () => { w.beginPath(); w.moveTo(pts[0].x, pts[0].y); for (const p of pts) w.lineTo(p.x, p.y); w.closePath(); };
    w.lineJoin = 'round'; w.lineCap = 'round';
    // tyre-wall band, shoulder, kerbs, asphalt
    path(); w.lineWidth = 2 * WALL + 26; w.strokeStyle = '#151515'; w.stroke();
    path(); w.setLineDash([10, 6]); w.lineWidth = 2 * WALL + 18; w.strokeStyle = '#2b2b2b'; w.stroke(); w.setLineDash([]);
    path(); w.lineWidth = 2 * WALL; w.strokeStyle = T.shoulder; w.stroke();
    for (let i = 0; i < 9000; i++) {
      const p = pick(pts), off = rand(-WALL, WALL); w.fillStyle = pick(T.speck); w.fillRect(p.x + p.nx * off, p.y + p.ny * off, 2, 2);
    }
    path(); w.lineWidth = 2 * HALF + 14; w.strokeStyle = '#b3201f'; w.stroke();
    path(); w.setLineDash([24, 24]); w.strokeStyle = '#e9e4da'; w.stroke(); w.setLineDash([]);
    path(); w.lineWidth = 2 * HALF; w.strokeStyle = T.road; w.stroke();
    for (let i = 0; i < 14000; i++) {
      const p = pick(pts), off = rand(-HALF + 2, HALF - 2); w.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.12)';
      w.fillRect(p.x + p.nx * off + rand(-4, 4), p.y + p.ny * off + rand(-4, 4), 2, 2);
    }
    path(); w.setLineDash([34, 34]); w.lineWidth = 3; w.strokeStyle = 'rgba(236,230,216,.28)'; w.stroke(); w.setLineDash([]);
    // start line chequers
    const s0 = pts[0];
    w.save(); w.translate(s0.x, s0.y); w.rotate(s0.a);
    for (let r = 0; r < 2; r++) for (let c = -8; c < 8; c++) { w.fillStyle = (r + c) % 2 ? '#111' : '#f2efe8'; w.fillRect(r * 8 - 8, c * (HALF / 8), 8, HALF / 8); }
    w.restore();

    // decorations beyond the wall
    const farFromTrack = (x, y, m) => { for (let k = 0; k < N; k += 3) if ((pts[k].x - x) ** 2 + (pts[k].y - y) ** 2 < m * m) return false; return true; };
    for (let i = 0; i < 260; i++) {
      const x = rand(30, WW - 30), y = rand(30, WH - 30);
      if (!farFromTrack(x, y, WALL + 46)) continue;
      drawDecor(w, T.decor, x, y);
    }
    // grandstand crowds hugging the wall
    for (let g = 0; g < 7; g++) {
      const c0 = Math.floor((g + 0.3) * N / 7), side = g % 2 ? 1 : -1;
      for (let k = -22; k <= 22; k += 1) {
        const p = pts[(c0 + k + N) % N];
        for (let row = 0; row < 4; row++) {
          const off = side * (WALL + 20 + row * 9);
          const x = p.x + p.nx * off + rand(-3, 3), y = p.y + p.ny * off + rand(-3, 3);
          if (!farFromTrack(x, y, WALL + 12)) continue;
          w.fillStyle = pick(['#d23b2f', '#2f6fd2', '#e8c33a', '#3aa457', '#ddd', '#8a3fbf', '#e07a2a']);
          w.beginPath(); w.arc(x, y, 3.4, 0, 7); w.fill();
          w.fillStyle = pick(['#f0c8a0', '#c58c5c', '#8a5a3a']); w.beginPath(); w.arc(x, y, 1.8, 0, 7); w.fill();
        }
      }
    }
    const ms = Math.min(170 / (maxx - minx), 118 / (maxy - miny));
    const { line, kap } = racingLine(pts, N);
    return (built[ti] = { T, pts, N, WW, WH, world, line, kap, mini: { s: ms, ox: minx, oy: miny, w: (maxx - minx) * ms, h: (maxy - miny) * ms } });
  }

  // Racing line in the spirit of K1999 (Remi Coulom's TORCS robot): treat the path as an elastic band
  // inside the track edges and keep pulling every point toward the midpoint of its neighbours, coarse to
  // fine. That straightens the straights and clips the apexes. Returns lateral offsets and curvature.
  function racingLine(pts, N) {
    const lim = HALF - 16, line = new Float64Array(N);
    const px = k => { k = (k + N) % N; return pts[k].x + pts[k].nx * line[k]; };
    const py = k => { k = (k + N) % N; return pts[k].y + pts[k].ny * line[k]; };
    for (const step of [48, 24, 12, 6, 3, 1]) {
      for (let it = 0; it < 50; it++) for (let k = 0; k < N; k++) {
        const mx = (px(k - step) + px(k + step)) / 2, my = (py(k - step) + py(k + step)) / 2, p = pts[k];
        const want = (mx - p.x) * p.nx + (my - p.y) * p.ny;
        line[k] = clamp(line[k] + (want - line[k]) * 0.5, -lim, lim);
      }
    }
    // signed curvature of the line (radians turned per pixel), lightly smoothed
    const raw = new Float64Array(N), kap = new Float64Array(N);
    for (let k = 0; k < N; k++) {
      const ax = px(k - 3), ay = py(k - 3), bx = px(k), by = py(k), cx = px(k + 3), cy = py(k + 3);
      const t = wrap(Math.atan2(cy - by, cx - bx) - Math.atan2(by - ay, bx - ax));
      raw[k] = t / Math.max(1, (hyp(bx - ax, by - ay) + hyp(cx - bx, cy - by)) / 2);
    }
    for (let k = 0; k < N; k++) { let s = 0; for (let j = -2; j <= 2; j++) s += raw[(k + j + N) % N]; kap[k] = s / 5; }
    return { line, kap };
  }

  // Speed profile: the fastest each point allows given how hard this car can turn, then a backwards pass
  // so it starts braking early enough to arrive at every corner at that speed (the classic TORCS approach)
  function speedProfile(c) {
    const N = track.N, kap = track.kap, v = new Float64Array(N);
    const rate = (2.5 + c.tire * 0.16 + c.grip * 0.08) * c.line;
    const top = (300 + c.eng * 28) * c.spd * 1.1;
    for (let k = 0; k < N; k++) v[k] = clamp(rate / Math.max(Math.abs(kap[k]), 1e-4), 95, top);
    const brake = 420;
    for (let pass = 0; pass < 2; pass++) for (let k = N - 1; k >= 0; k--) { const nx = v[(k + 1) % N]; v[k] = Math.min(v[k], Math.sqrt(nx * nx + 2 * brake * SP)); }
    c.prof = v;
  }

  function drawDecor(w, kind, x, y) {
    w.save(); w.translate(x, y); w.rotate(rand(0, 6.28));
    w.fillStyle = 'rgba(0,0,0,.25)'; w.beginPath(); w.ellipse(5, 6, 18, 14, 0, 0, 7); w.fill();
    const r = Math.random();
    if (kind === 'desert') {
      if (r < 0.45) { w.fillStyle = '#8f8a7c'; w.beginPath(); w.ellipse(0, 0, rand(10, 20), rand(8, 15), 0, 0, 7); w.fill(); w.fillStyle = '#a8a292'; w.beginPath(); w.ellipse(-3, -3, 7, 5, 0, 0, 7); w.fill(); }
      else if (r < 0.8) { w.fillStyle = '#4c7a3a'; w.beginPath(); w.arc(0, 0, 8, 0, 7); w.fill(); w.fillRect(-14, -3, 10, 6); w.fillRect(4, -3, 10, 6); w.fillStyle = '#6a9a4c'; w.beginPath(); w.arc(-1, -1, 4, 0, 7); w.fill(); }
      else { w.strokeStyle = '#7a5a34'; w.lineWidth = 2; for (let i = 0; i < 7; i++) { w.beginPath(); w.moveTo(0, 0); w.lineTo(rand(-14, 14), rand(-14, 14)); w.stroke(); } }
    } else if (kind === 'scrap') {
      if (r < 0.35) { for (let i = 0; i < 3; i++) { w.fillStyle = '#141414'; w.beginPath(); w.arc(i * 6 - 6, i % 2 * 5, 10, 0, 7); w.fill(); w.fillStyle = '#3a3a3a'; w.beginPath(); w.arc(i * 6 - 6, i % 2 * 5, 4, 0, 7); w.fill(); } }
      else if (r < 0.7) { w.fillStyle = pick(['#7a3d22', '#5a4a3a', '#6e2c22', '#3d4a52']); w.fillRect(-20, -10, 40, 20); w.fillStyle = 'rgba(0,0,0,.35)'; w.fillRect(-4, -8, 10, 16); w.fillStyle = '#8b5530'; w.fillRect(-18, -8, 6, 5); }
      else { w.fillStyle = pick(['#2a5a9a', '#9a2a2a', '#3a7a3a']); w.beginPath(); w.arc(0, 0, 8, 0, 7); w.fill(); w.strokeStyle = 'rgba(0,0,0,.4)'; w.lineWidth = 2; w.beginPath(); w.arc(0, 0, 5, 0, 7); w.stroke(); }
    } else {
      if (r < 0.65) { w.fillStyle = pick(['#5e3324', '#4a2a1e', '#6e3e2c']); w.beginPath(); const k = 7; for (let i = 0; i < k; i++) { const a = i / k * 6.28, rr = rand(10, 22); w.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } w.closePath(); w.fill(); w.fillStyle = 'rgba(255,255,255,.08)'; w.beginPath(); w.arc(-4, -4, 5, 0, 7); w.fill(); }

    if (c.isPlayer) sfx.swap();
  }
  function useSpecial(c, type, dt) {
    if (!type || !(c.sp[type] > 0)) return;
    const ca = Math.cos(c.a), sa = Math.sin(c.a);
    if (type === 'flame') {
      c.sp.flame = Math.max(0, c.sp.flame - 30 * dt); c.flameT = 0.08;
      for (let i = 0; i < 3; i++) {
        const a = c.a + rand(-0.22, 0.22), s = rand(320, 470);
        parts.push({ x: c.x + ca * 22, y: c.y + sa * 22, vx: c.vx + Math.cos(a) * s, vy: c.vy + Math.sin(a) * s, life: rand(0.2, 0.32), max: 0.32, kind: 'flame', size: rand(4, 8) });
      }
      for (const o of cars) {
        if (o === c || o.dead) continue;
        const dx = o.x - c.x, dy = o.y - c.y;
        if (hyp(dx, dy) < 150 && Math.abs(wrap(Math.atan2(dy, dx) - c.a)) < 0.4) { hurt(o, 11 * dt, c); ignite(o, c, 2); }
      }
      for (let i = peds.length - 1; i >= 0; i--) {
        const dx = peds[i].x - c.x, dy = peds[i].y - c.y;
        if (hyp(dx, dy) < 150 && Math.abs(wrap(Math.atan2(dy, dx) - c.a)) < 0.45) burnPed(i, c);
      }
      for (const b of bikers) {
        const dx = b.x - c.x, dy = b.y - c.y;
        if (hyp(dx, dy) < 150 && Math.abs(wrap(Math.atan2(dy, dx) - c.a)) < 0.45) igniteBiker(b, c);
      }
      for (const m of bikes) {
        const dx = m.x - c.x, dy = m.y - c.y;
        if (!m.wrecked && m.fuse < 0 && hyp(dx, dy) < 140 && Math.abs(wrap(Math.atan2(dy, dx) - c.a)) < 0.4) { m.fuse = rand(0.8, 1.6); m.by = c; }
      }
      if (c.flameSnd <= 0) { sfx.flame(c.isPlayer ? 1 : near(c.x, c.y)); c.flameSnd = 0.12; }

    }
    if (c.spCd > 0) return;
    c.sp[type]--;

      const sp = type === 'rocket' ? 720 : 540;
      rockets.push({ kind: type, x: c.x + ca * 24, y: c.y + sa * 24, a: c.a, sp, vx: c.vx * 0.5 + ca * sp, vy: c.vy * 0.5 + sa * sp,
        owner: c, idx: c.idx, life: type === 'rocket' ? 1.6 : 4, target: null });

  // ---------- Final lap: the Iron Vultures park their bikes across the track ----------
  const SKINS = ['#f0c8a0', '#c58c5c', '#8a5a3a', '#e8b890'];
  function makeBiker(x, y, a, idx) {
    return { x, y, a, idx, vx: 0, vy: 0, z: 0, vz: 0, spin: 0, st: 'alive', burnT: 0, ph: rand(0, 6), pooled: false, charred: false,
      jacket: pick(['#141414', '#2a1d14', '#3a2a1a', '#1a1a24']), head: pick(['bald', 'bandana', 'helmet']), skin: pick(SKINS), bat: Math.random() < 0.5 };
  }
  function spawnGang() {
    gangDone = true;
    const N = track.N;
    for (const f of [0.38, 0.72]) {
      let idx = Math.floor(f * N);
      for (let t = 0; t < 6 && cars.some(c => !c.dead && hyp(c.x - track.pts[idx].x, c.y - track.pts[idx].y) < 380); t++) idx = (idx + 40) % N;
      const p = track.pts[idx], s = Math.random() < 0.5 ? -1 : 1;
      gangs.push({ idx, p, s, gap: -s * (HALF - 26) });
      for (let lat = WALL - 16; lat >= -HALF + 52; lat -= 24) {
        const x = p.x + p.nx * lat * s, y = p.y + p.ny * lat * s;
        bikes.push({ x, y, idx, vx: 0, vy: 0, z: 0, vz: 0, a: p.a + Math.PI / 2 + rand(-0.35, 0.35), spin: 0, hp: 6, fuse: -1, wrecked: false, by: null,
          color: pick(['#1d1e22', '#7a1a14', '#23305a', '#c9a23a', '#4a4a4a', '#5a1a5a']) });
        const n = Math.random() < 0.5 ? 2 : 1;
        for (let j = 0; j < n; j++) {
          const up = rand(15, 30), side = rand(-10, 10);
          bikers.push(makeBiker(x - Math.cos(p.a) * up + p.nx * side, y - Math.sin(p.a) * up + p.ny * side, p.a + Math.PI + rand(-0.6, 0.6), idx));
        }
      }
    }
    msg('BIKER GANG ON THE TRACK!', '#ff8a1f');
    msg('THE IRON VULTURES WANT A TOLL', INK);
  }

  // shared physics for flying bodies, limbs and bikes: gravity, bounce, slide, spin, walls
  function phys(o, dt, fric, bleed) {
    if (o.z > 0 || o.vz > 0) {
      o.vz -= 900 * dt; o.z += o.vz * dt;
      if (o.z <= 0) {
        o.z = 0;
        if (o.vz < -160) { o.vz = -o.vz * 0.3; if (bleed) bloodSplat(o.x, o.y, rand(0, 6.28), 12); else { burst(o.x, o.y, 5, 'spark'); sfx.crash(near(o.x, o.y) * 0.4); } }
        else o.vz = 0;
      }
    }
    const ground = o.z <= 0.5;
    if (ground) { const f = Math.pow(fric, dt); o.vx *= f; o.vy *= f; o.spin *= Math.pow(0.12, dt); }
    o.x += o.vx * dt; o.y += o.vy * dt; o.a += o.spin * dt;
    const sp = hyp(o.vx, o.vy);
    if (bleed && ground && sp > 25) { dctx.fillStyle = `rgba(125,8,6,${clamp(sp / 350, 0.2, 0.7)})`; dctx.fillRect(o.x - 2.5, o.y - 2.5, 5, 5); }
    if (bleed && ground && sp < 6 && !o.pooled) { o.pooled = true; dctx.fillStyle = 'rgba(105,6,4,.75)'; dctx.beginPath(); dctx.ellipse(o.x, o.y, rand(9, 15), rand(6, 10), rand(0, 3), 0, 7); dctx.fill(); }
    if (sp > 60) o.pooled = false;
    o.idx = nearest(o.x, o.y, o.idx, 14);
    const q = track.pts[o.idx], dx = o.x - q.x, dy = o.y - q.y, d = hyp(dx, dy);
    if (d > WALL - 6) {
      const nx = dx / d, ny = dy / d, vn = o.vx * nx + o.vy * ny;
      o.x = q.x + nx * (WALL - 6); o.y = q.y + ny * (WALL - 6);
      if (vn > 0) { o.vx -= 1.4 * vn * nx; o.vy -= 1.4 * vn * ny; if (bleed && vn > 120) bloodSplat(o.x, o.y, Math.atan2(ny, nx), 14); }
    }
  }

  function killBiker(b, by, how, dir = rand(0, 6.28)) {
    if (b.st === 'dead' || b.st === 'gone') return;
    b.st = 'dead'; b.burnT = 0;
    if (how === 'char') { b.charred = true; burst(b.x, b.y, 10, 'fire'); burst(b.x, b.y, 6, 'smoke'); }
    else { bloodSplat(b.x, b.y, dir, 26); burst(b.x, b.y, 18, 'gib'); }
    sfx.scream(near(b.x, b.y));
    if (by && by.isPlayer) {
      career.cash += 50;
      if (raceT - (killBiker.lastT || -9) < 0.35) return; // one callout at a time when a whole gang goes up
      killBiker.lastT = raceT;
      floats.push({ x: b.x, y: b.y - 14, text: how === 'char' ? pick(['BIKER BBQ', 'CHARGRILLED']) : how === 'blast' ? pick(['AIRMAIL', 'SPLATTERED', 'LIFTOFF']) : pick(['ROADKILL', 'HOOD ORNAMENT', 'TOLL PAID', 'SPEED BUMP']), life: 1.1, color: BLOOD });
    }
  }
  // blown to pieces: the body is replaced by flying limbs, a head and a lot of red
  function gibBiker(b, nx, ny, k) {
    b.st = 'gone';
    bloodSplat(b.x, b.y, Math.atan2(ny, nx), 30); burst(b.x, b.y, 34, 'gib');
    for (const part of ['head', 'arm', 'arm', 'leg', 'leg', 'torso']) {
      const a = Math.atan2(ny, nx) + rand(-1.1, 1.1), s = rand(250, 650) * k;
      debris.push({ kind: part, x: b.x, y: b.y, idx: b.idx, vx: Math.cos(a) * s, vy: Math.sin(a) * s, z: 4, vz: rand(250, 560) * k, a: rand(0, 6.28), spin: rand(-22, 22),
        color: part === 'head' ? b.skin : part === 'leg' ? '#2a3346' : b.jacket, pooled: false });
    }
  }
  // shockwave from any explosion: kills, launches and shreds bikers, throws bikes and sets them off
  function blast(x, y, R, by) {
    for (const b of bikers) {
      if (b.st === 'gone') continue;
      const d = hyp(b.x - x, b.y - y);
      if (d > R * 1.4) continue;
      const k = 1 - d / (R * 1.4), nx = (b.x - x) / (d || 1), ny = (b.y - y) / (d || 1);
      if (b.st !== 'dead') killBiker(b, by, 'blast', Math.atan2(ny, nx));
      if (d < R * 0.55 && Math.random() < 0.7) { gibBiker(b, nx, ny, 0.6 + k); continue; }
      b.vx += nx * 720 * k + rand(-60, 60); b.vy += ny * 720 * k + rand(-60, 60); b.vz += 260 + 480 * k; b.spin = rand(-24, 24);
    }
    for (const o of debris) {
      const d = hyp(o.x - x, o.y - y); if (d > R * 1.4) continue;
      const k = 1 - d / (R * 1.4); o.vx += (o.x - x) / (d || 1) * 600 * k; o.vy += (o.y - y) / (d || 1) * 600 * k; o.vz += 300 * k; o.spin = rand(-25, 25);
    }
    for (const m of bikes) {
      const d = hyp(m.x - x, m.y - y); if (d > R * 1.4) continue;
      const k = 1 - d / (R * 1.4), nx = (m.x - x) / (d || 1), ny = (m.y - y) / (d || 1);
      m.vx += nx * 520 * k + rand(-40, 40); m.vy += ny * 520 * k + rand(-40, 40); m.vz += 200 + 340 * k; m.spin = rand(-16, 16);
      if (!m.wrecked && m.fuse < 0 && d < R) { m.fuse = rand(0.25, 0.8); m.by = by; }
    }
  }
  function igniteBiker(b, by) {
    if (b.st !== 'alive') return;
    b.st = 'burning'; b.burnT = rand(1.8, 3); b.by = by; b.a = rand(0, 6.28);
    sfx.scream(near(b.x, b.y));
  }

  function updateGang(dt) {
    for (const b of bikers) {
      if (b.st === 'alive') {
        b.ph += dt;
        for (const c of cars) {
          const sp = hyp(c.vx, c.vy);
          if (c.dead || sp < 40 || hyp(c.x - b.x, c.y - b.y) > 16) continue;
          // run over: big splatter, the body flies off the bonnet, and it costs you a lot of speed
          killBiker(b, c, 'splat', Math.atan2(c.vy, c.vx));
          b.vx = c.vx * 0.95 + rand(-50, 50); b.vy = c.vy * 0.95 + rand(-50, 50); b.vz = 110 + sp * 0.55; b.spin = rand(-14, 14);
          c.vx *= 0.6; c.vy *= 0.6; c.bloodT = 3; hurt(c, 2, null);
          if (c.isPlayer) shake = Math.max(shake, 6);
          break;
        }
      } else if (b.st === 'burning') {
        b.burnT -= dt; b.ph += dt * 3;
        b.a += rand(-6, 6) * dt;
        b.x += Math.cos(b.a) * 75 * dt; b.y += Math.sin(b.a) * 75 * dt;
        b.idx = nearest(b.x, b.y, b.idx, 10);
        const q = track.pts[b.idx]; if (hyp(b.x - q.x, b.y - q.y) > WALL - 8) b.a += Math.PI;
        if (Math.random() < 0.8) parts.push({ x: b.x + rand(-4, 4), y: b.y + rand(-4, 4), vx: rand(-10, 10), vy: rand(-40, -15), life: 0.35, max: 0.35, kind: 'fire', size: rand(3, 6) });
        if (b.burnT <= 0) killBiker(b, b.by, 'char');
        for (const c of cars) if (!c.dead && hyp(c.vx, c.vy) > 40 && hyp(c.x - b.x, c.y - b.y) < 16) { killBiker(b, c, 'splat', Math.atan2(c.vy, c.vx)); b.vx = c.vx * 0.9; b.vy = c.vy * 0.9; b.vz = 200; c.vx *= 0.7; c.vy *= 0.7; c.bloodT = 3; }
      } else if (b.st === 'dead') {
        phys(b, dt, 0.08, !b.charred);
        // driving through a body kicks it along and drags you down
        if (b.z < 6) for (const c of cars) {
          if (c.dead || hyp(c.x - b.x, c.y - b.y) > 15) continue;
          const sp = hyp(c.vx, c.vy); if (sp < 30) continue;
          b.vx = c.vx * 0.7 + rand(-30, 30); b.vy = c.vy * 0.7 + rand(-30, 30); b.vz = Math.max(b.vz, sp > 160 ? 90 : 20); b.spin = rand(-8, 8);
          c.vx *= 0.88; c.vy *= 0.88; c.bloodT = 3;
        }
      }
    }
    for (let i = debris.length - 1; i >= 0; i--) phys(debris[i], dt, 0.1, true);
    if (debris.length > 160) debris.splice(0, debris.length - 160);
    for (const m of bikes) {
      phys(m, dt, 0.25, false);
      if (m.fuse >= 0) {
        m.fuse -= dt;
        if (Math.random() < 0.7) parts.push({ x: m.x + rand(-6, 6), y: m.y + rand(-6, 6), vx: 0, vy: rand(-30, -10), life: 0.3, max: 0.3, kind: 'fire', size: rand(3, 6) });
        if (m.fuse < 0) { m.wrecked = true; m.fuse = -1; explode(m.x, m.y, m.by, 0.75); }
      }
      // a parked bike is heavy but movable: it gets shoved and the car loses speed
      for (const c of cars) {
        if (c.dead || m.z > 10) continue;
        const dx = m.x - c.x, dy = m.y - c.y, d = hyp(dx, dy);
        if (d >= 24 || d === 0) continue;
        const nx = dx / d, ny = dy / d, ov = 24 - d;
        m.x += nx * ov * 0.8; m.y += ny * ov * 0.8; c.x -= nx * ov * 0.2; c.y -= ny * ov * 0.2;
        const rel = (c.vx - m.vx) * nx + (c.vy - m.vy) * ny;
        if (rel > 0) {
          m.vx += nx * rel * 1.25; m.vy += ny * rel * 1.25; m.spin += rand(-8, 8) * rel / 200; if (rel > 180) m.vz = rel * 0.35;
          c.vx -= nx * rel * 0.4; c.vy -= ny * rel * 0.4;
          if (rel > 100) { hurt(c, (rel - 100) * 0.025, null); sfx.crash(near(c.x, c.y) * 0.6); burst(m.x, m.y, 6, 'spark'); }
        }
      }
    }
  }
  function killPed(i, dir, car) {
    const p = peds[i];
    bloodSplat(p.x, p.y, dir, 16); burst(p.x, p.y, 10, 'gib');
    sfx.scream(near(p.x, p.y));
    if (car) { car.bloodT = 2.2; if (car.isPlayer) floats.push({ x: p.x, y: p.y - 12, text: pick(['SPLAT', 'SQUISH', 'OOPS', 'ROADKILL']), life: 1 }); }
    peds.splice(i, 1);
  }

  function fire(c) {
    if (c.fireCd > 0 || c.ammo <= 0) return;
    c.fireCd = (0.1 - c.gun * 0.016) * c.fireMul; c.ammo--; c.muzzle = 0.05;
    const a = c.a + rand(-0.035, 0.035), ca = Math.cos(c.a), sa = Math.sin(c.a);
    bullets.push({ x: c.x + ca * 22, y: c.y + sa * 22, vx: c.vx + Math.cos(a) * 980, vy: c.vy + Math.sin(a) * 980, life: 0.55, owner: c, idx: c.idx, dmg: 1.3 + c.gun * 0.6 });
    if (c.sndCd <= 0) { sfx.gun(c.isPlayer ? 1 : near(c.x, c.y) * 0.7); c.sndCd = 0.07; }
  }
  function dropMine(c) {
    if (c.mineCd > 0 || c.mines <= 0) return;
    c.mineCd = 0.6; c.mines--;
    mines.push({ x: c.x - Math.cos(c.a) * 26, y: c.y - Math.sin(c.a) * 26, owner: c, arm: 0.7, t: 0 });
    if (c.isPlayer) sfx.mine();
  }

  // ================= AI =================
  function aiControl(c, dt) {
    const ai = c.ai, N = track.N, P = track.pts;
    const ctl = { thr: 1, steer: 0, fire: false, mine: false, turbo: false };
    if (ai.rev > 0) { ai.rev -= dt; ctl.thr = -1; ctl.steer = ai.revSteer; return ctl; }
    const fwd = c.fwd, D = diffOf();
    if (!c.prof) speedProfile(c);
    // pure pursuit: chase a point on the racing line that sits further ahead the faster we go
    const look = Math.round(6 + Math.max(0, fwd) * 0.045);
    const i2 = (c.idx + look) % N, p = P[i2];
    ai.laneT -= dt; if (ai.laneT < 0) { ai.lane = rand(-30, 30); ai.laneT = rand(2, 5); }
    let lane = D.line ? track.line[i2] : ai.lane * 0.6 + track.line[i2] * 0.4, dodging = false;
    const hazards = [...mines.filter(m => m.owner !== c), ...drums, ...fires];
    for (const m of hazards) if (hyp(m.x - p.x, m.y - p.y) < (m.r || 0) + 70) { const ml = (m.x - p.x) * p.nx + (m.y - p.y) * p.ny; lane = ml > 0 ? ml - 46 - (m.r || 0) : ml + 46 + (m.r || 0); dodging = true; }
    for (const g of gangs) { const ahead = (g.idx - c.idx + N) % N; if (ahead < look * 2 + 34) { lane = g.gap; dodging = true; } }
    lane = clamp(lane, -HALF + 12, HALF - 12);
    const tx = p.x + p.nx * lane, ty = p.y + p.ny * lane;
    const diff = wrap(Math.atan2(ty - c.y, tx - c.x) - c.a);
    ctl.steer = clamp(diff * 3.2, -1, 1);
    // throttle follows the speed profile a few points ahead; it never asks to go backwards
    const vt = c.prof[(c.idx + 4) % N] * c.rb * (dodging ? 0.85 : 1) * (Math.abs(diff) > 0.9 ? 0.6 : 1);
    ctl.thr = fwd < vt - 6 ? 1 : fwd > vt + 30 ? -1 : 0;
    const curv = Math.abs(wrap(P[(c.idx + look * 2 + 12) % N].a - P[c.idx].a));
    ai.turboT -= dt;
    if (curv < 0.22 && c.turbo > 25 && fwd > 220 && ai.turboT < -2 && Math.random() < 0.02 + ai.boost * 0.02) ai.turboT = rand(0.8, 1.6);
    ctl.turbo = ai.turboT > 0 && curv < 0.4;
    const ca = Math.cos(c.a), sa = Math.sin(c.a);
    let hunt = null, huntA = 0.5, inSights = false, front = false, close = false, seek = false, behind = false;
    ai.mineCd -= dt; ai.spCd -= dt; ai.calm -= dt; ai.burst -= dt; ai.rivalT -= dt;
    // most of the time rivals leave each other alone and race; now and then one picks a fight
    if (ai.rivalT < 0) { ai.rivalOk = Math.random() < D.infight; ai.rivalT = rand(3, 7); }
    for (const o of cars) {
      if (o === c || o.dead || !(o.isPlayer || ai.rivalOk)) continue;
      const dx = o.x - c.x, dy = o.y - c.y, d = hyp(dx, dy);
      // aim where the target will be when the bullets arrive
      const t = d / 980 * D.lead, ax = dx + o.vx * t, ay = dy + o.vy * t;
      const off = Math.abs(wrap(Math.atan2(ay, ax) - c.a));
      const want = off - (o.isPlayer ? D.focus * 0.2 : 0);
      if (d < D.range && off < D.aim) inSights = true;
      if (D.hunt && d < D.range && want < huntA) { hunt = Math.atan2(ay, ax); huntA = want; }
      if (d < 650 && off < 0.12) front = true;
      if (d < 140 && off < 0.45) close = true;
      if (d < 900 && off < 0.9) seek = true;
      if (d < 240 && dx * ca + dy * sa < -20) behind = true;
      if (d < 230 && dx * ca + dy * sa < -20 && ai.mineCd < 0 && c.mines > 0) { ctl.mine = true; ai.mineCd = rand(9, 16) * D.mine; }
    }
    // shoot in short bursts with long pauses, so most of their attention goes to driving
    if (inSights && ai.burst <= 0 && ai.calm <= 0) { ai.burst = rand(0.5, 1.2); ai.calm = ai.burst + rand(2, 4.5) / D.agg; }
    ctl.fire = inSights && ai.burst > 0;
    if (ai.spCd < 0) {
      const pickSp = close && ai.burst > 0 && c.sp.flame > 0 ? 'flame' : seek && c.sp.seeker > 0 && Math.random() < 0.5 ? 'seeker'
        : front && c.sp.rocket > 0 ? 'rocket' : behind && c.sp.drum > 0 ? 'drum' : null;
      if (pickSp) { ctl.special = pickSp; if (pickSp !== 'flame') ai.spCd = rand(6, 12) / D.agg; }
    }
    // only on Insane do rivals steer off their line to line up a shot
    if (hunt !== null && curv < 0.5) ctl.steer = clamp(ctl.steer * 0.65 + clamp(wrap(hunt - c.a) * 3, -1, 1) * 0.35, -1, 1);
    // only back out after a full second of pushing forward and going nowhere (wall, wreck, bike pile)
    if (Math.abs(fwd) < 22 && ctl.thr > 0 && state === 'race') {
      ai.stuck += dt;
      if (ai.stuck > 1.0) { ai.rev = rand(0.5, 0.8); ai.revSteer = -(Math.sign(diff) || 1); ai.stuck = 0; }
    } else ai.stuck = 0;
    // light rubber band so races stay close
    if (!c.isPlayer && player && !player.dead) {
      const gap = (prog(c) - prog(player)) / N;
      c.rb = gap > 0 ? 1 - (1 - D.rb[0]) * clamp((gap - 0.08) / 0.25, 0, 1) : 1 + (D.rb[1] - 1) * clamp((-gap - 0.15) / 0.3, 0, 1);
    } else c.rb = 1;
    return ctl;
  }

  // ================= update =================
  function drive(c, ctl, dt) {
    const ca = Math.cos(c.a), sa = Math.sin(c.a);
    let fwd = c.vx * ca + c.vy * sa, lat = -c.vx * sa + c.vy * ca;
    const turbo = ctl.turbo && c.turbo > 0 && ctl.thr > 0;
    if (turbo) {
      c.turbo = Math.max(0, c.turbo - 32 * dt);
      if (Math.random() < 0.7) parts.push({ x: c.x - ca * 20 + rand(-3, 3), y: c.y - sa * 20 + rand(-3, 3), vx: -ca * 80, vy: -sa * 80, life: 0.18, max: 0.18, kind: 'fire', size: rand(3, 6) });
    }
    const top = (300 + c.eng * 28) * c.spd * c.rb * (turbo ? 1.32 : 1) * (c.offroad ? 0.55 : 1);
    const acc = (240 + c.eng * 30) * (turbo ? 1.8 : 1);
    if (ctl.thr > 0) { if (fwd < top) fwd += acc * dt; else fwd -= (fwd - top) * 1.6 * dt; }
    else if (ctl.thr < 0) { fwd -= (fwd > 0 ? 540 : 230) * dt; if (fwd < -150) fwd = -150; }
    else fwd -= Math.sign(fwd) * Math.min(Math.abs(fwd), 120 * dt);
    if (c.offroad) fwd -= fwd * 0.8 * dt;
    lat -= lat * Math.min(1, ((c.offroad ? 3.4 : 6.2) + c.tire * 1.1 + c.grip) * dt);
    const rate = (2.5 + c.tire * 0.16 + c.grip * 0.08) * clamp(Math.abs(fwd) / 110, 0, 1) * (fwd < 0 ? -1 : 1);
    c.a = wrap(c.a + ctl.steer * rate * dt);
    c.vx = ca * fwd - sa * lat; c.vy = sa * fwd + ca * lat;
    c.fwd = fwd; c.lat = lat;
    // tyre marks, red after a splat
    if (Math.abs(lat) > 75 || (ctl.thr < 0 && fwd > 160) || turbo && Math.random() < 0.3 || c.bloodT > 0 && Math.abs(fwd) > 40) {
      dctx.fillStyle = c.bloodT > 0 ? `rgba(130,8,8,${0.35 * clamp(c.bloodT, 0, 1)})` : 'rgba(18,14,12,.22)';
      for (const s of [-8, 8]) dctx.fillRect(c.x - ca * 12 - sa * s - 2, c.y - sa * 12 + ca * s - 2, 4, 4);
    }
  }

  function trackClamp(c, rad) {
    const prev = c.idx, N = track.N;
    c.idx = nearest(c.x, c.y, c.idx, 26);
    const p = track.pts[c.idx], dx = c.x - p.x, dy = c.y - p.y, d = hyp(dx, dy);
    c.offroad = d > HALF + 6;
    const lim = WALL - rad;
    if (d > lim) {
      const nx = dx / d, ny = dy / d;
      c.x = p.x + nx * lim; c.y = p.y + ny * lim;
      const vn = c.vx * nx + c.vy * ny;
      if (vn > 0) {
        c.vx -= 1.5 * vn * nx; c.vy -= 1.5 * vn * ny;
        if (vn > 140) { hurt(c, (vn - 140) * 0.06, c.lastHit && raceT - c.lastHitT < 3 ? c.lastHit : null); sfx.crash(near(c.x, c.y) * clamp(vn / 400, 0.3, 1)); burst(c.x + nx * 14, c.y + ny * 14, 6, 'spark'); if (c.isPlayer) shake = Math.max(shake, vn / 60); }
      }
    }
    if (prev > N * 0.75 && c.idx < N * 0.25) onLap(c);
    else if (prev < N * 0.25 && c.idx > N * 0.75) c.lap--;
  }
  function onLap(c) {
    c.lap++;
    if (c.lap >= 1) c.lapTimes.push(raceT);
    if (c.lap === LAPS - 1 && !gangDone && !c.dead) spawnGang();
    if (c.lap >= LAPS && !c.finished && !c.dead) {
      c.finished = true; finishOrder.push(c);
      if (c.isPlayer) { const pos = finishOrder.length; msg(pos === 1 ? 'YOU WIN!' : `FINISHED ${ordinal(pos)}`, HAZ); sfx.lap(); }
      else if (finishOrder.length === 1) msg(`${c.name.toUpperCase()} TAKES THE FLAG`);
    } else if (c.isPlayer && c.lap >= 1 && c.lap < LAPS) { msg(c.lap === LAPS - 1 ? 'FINAL LAP' : `LAP ${c.lap + 1}`, HAZ); sfx.lap(); }
  }
  const ordinal = n => n + (['th', 'st', 'nd', 'rd'][n] || 'th');

  function standings() {
    const alive = cars.filter(c => !c.finished && !c.dead).sort((a, b) => prog(b) - prog(a));
    const dead = cars.filter(c => c.dead && !c.finished).sort((a, b) => b.deadT - a.deadT);
    return [...finishOrder, ...alive, ...dead];
  }

  function update(dt) {
    if (state === 'count') {
      countT -= dt;
      const n = Math.ceil(countT - 1);
      if (n < lastBeep) { lastBeep = n; if (n <= 2) sfx.beep(n <= -1 ? true : n === 0); }
      if (countT <= 1) { state = 'race'; sfx.beep(true); }
    }
    const live = state === 'race' || state === 'ending';
    if (live) raceT += dt;

    for (const c of cars) {
      c.fireCd -= dt; c.mineCd -= dt; c.sndCd -= dt; c.muzzle -= dt; c.flash -= dt; c.bloodT -= dt;
      c.spCd -= dt; c.flameT -= dt; c.flameSnd -= dt;
      if (c.burnT > 0) {
        c.burnT -= dt;
        if (!c.dead) hurt(c, 3 * dt, c.burnBy);
        if (Math.random() < 0.6) parts.push({ x: c.x + rand(-9, 9), y: c.y + rand(-6, 6), vx: rand(-15, 15), vy: rand(-40, -10), life: 0.35, max: 0.35, kind: 'fire', size: rand(3, 7) });
      }
      if (c.dead) {
        c.vx *= Math.pow(0.08, dt); c.vy *= Math.pow(0.08, dt); c.x += c.vx * dt; c.y += c.vy * dt;
        if (Math.random() < 0.35) parts.push({ x: c.x + rand(-6, 6), y: c.y + rand(-6, 6), vx: rand(-10, 10), vy: rand(-25, -5), life: 1.4, max: 1.4, kind: 'smoke', size: rand(6, 11) });
        if (Math.random() < 0.2) parts.push({ x: c.x + rand(-8, 8), y: c.y + rand(-5, 5), vx: 0, vy: -20, life: 0.4, max: 0.4, kind: 'fire', size: rand(3, 6) });
        trackClamp(c, 14);
        continue;
      }
      let ctl;
      if (!live) ctl = { thr: 0, steer: 0 };
      else if (c.isPlayer && !c.finished) ctl = {
        thr: (held('gas') ? 1 : 0) - (held('brake') ? 1 : 0), steer: (held('right') ? 1 : 0) - (held('left') ? 1 : 0),
        fire: held('fire'), mine: held('mine'), turbo: held('turbo'), special: held('special') ? SP_ORDER[c.spSel] : null };
      else ctl = aiControl(c, dt);
      if (c.finished) { ctl.fire = false; ctl.mine = false; ctl.special = null; }
      drive(c, ctl, dt);
      c.x += c.vx * dt; c.y += c.vy * dt;
      trackClamp(c, 14);
      if (live && ctl.fire) fire(c);
      if (live && ctl.mine) dropMine(c);
      if (live && ctl.special) useSpecial(c, ctl.special, dt);
      if (c.hp < 45 && Math.random() < (45 - c.hp) / 60) parts.push({ x: c.x - Math.cos(c.a) * 6, y: c.y - Math.sin(c.a) * 6, vx: rand(-10, 10), vy: rand(-10, 10), life: 1, max: 1, kind: 'smoke', size: rand(4, 8) });
      if (c.hp < 20 && Math.random() < 0.25) parts.push({ x: c.x + rand(-5, 5), y: c.y + rand(-5, 5), vx: 0, vy: 0, life: 0.3, max: 0.3, kind: 'fire', size: rand(3, 5) });
    }

    // car vs car
    for (let i = 0; i < cars.length; i++) for (let j = i + 1; j < cars.length; j++) {
      const a = cars[i], b = cars[j], dx = b.x - a.x, dy = b.y - a.y, d = hyp(dx, dy);
      if (d >= 30 || d === 0) continue;
      const nx = dx / d, ny = dy / d, ov = 30 - d;
      const wa = a.dead ? 0 : b.dead ? 1 : 0.5, wb = 1 - wa;
      a.x -= nx * ov * wa; a.y -= ny * ov * wa; b.x += nx * ov * wb; b.y += ny * ov * wb;
      const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (rel < 0) {
        const J = -1.3 * rel;
        a.vx -= J * nx * wa * 2 * 0.5; a.vy -= J * ny * wa * 2 * 0.5; b.vx += J * nx * wb * 2 * 0.5; b.vy += J * ny * wb * 2 * 0.5;
        if (-rel > 90) { const dmg = (-rel - 90) * 0.05; hurt(a, dmg, b); hurt(b, dmg, a); sfx.crash(near(a.x, a.y)); burst((a.x + b.x) / 2, (a.y + b.y) / 2, 5, 'spark'); if (a.isPlayer || b.isPlayer) shake = Math.max(shake, -rel / 70); }
      }
    }

    // bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      b.idx = nearest(b.x, b.y, b.idx, 10);
      const p = track.pts[b.idx];
      let gone = b.life <= 0;
      if (!gone && hyp(b.x - p.x, b.y - p.y) > WALL) { gone = true; burst(b.x, b.y, 3, 'spark'); }
      if (!gone) for (const c of cars) {
        if (c === b.owner || c.dead || hyp(c.x - b.x, c.y - b.y) > 15) continue;
        hurt(c, b.dmg, b.owner); burst(b.x, b.y, 3, 'spark'); if (c.isPlayer || b.owner.isPlayer) sfx.ping(0.8); gone = true; break;
      }
      if (!gone) for (let k = peds.length - 1; k >= 0; k--) if (hyp(peds[k].x - b.x, peds[k].y - b.y) < 9) { killPed(k, Math.atan2(b.vy, b.vx), null); gone = true; break; }
      if (!gone) for (const bk of bikers) {
        if (bk.st === 'gone' || bk.z > 12 || hyp(bk.x - b.x, bk.y - b.y) > 9) continue;
        const dir = Math.atan2(b.vy, b.vx);
        if (bk.st === 'dead') { bk.vx += Math.cos(dir) * 60; bk.vy += Math.sin(dir) * 60; bloodSplat(bk.x, bk.y, dir, 4); }
        else killBiker(bk, b.owner, 'splat', dir);
        gone = true; break;
      }
      if (!gone) for (const m of bikes) {
        if (m.wrecked || m.z > 12 || hyp(m.x - b.x, m.y - b.y) > 12) continue;
        burst(b.x, b.y, 3, 'spark'); if (--m.hp <= 0 && m.fuse < 0) { m.fuse = 0.4; m.by = b.owner; }
        gone = true; break;
      }
      if (!gone) for (let k = drums.length - 1; k >= 0; k--) if (hyp(drums[k].x - b.x, drums[k].y - b.y) < 11) { const d = drums.splice(k, 1)[0]; d.owner = b.owner; drumBoom(d); gone = true; break; }
      if (gone) bullets.splice(i, 1);
    }

    // rockets and heat seekers
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.life -= dt;
      if (r.kind === 'seeker') {
        if (!r.target || r.target.dead) {
          let best = null, bd = 1100;
          for (const o of cars) {
            if (o === r.owner || o.dead) continue;
            const dx = o.x - r.x, dy = o.y - r.y, d = hyp(dx, dy);
            if (d < bd && Math.abs(wrap(Math.atan2(dy, dx) - r.a)) < 1.3) { bd = d; best = o; }
          }
          r.target = best;
        }
        if (r.target) { const t = r.target, want = Math.atan2(t.y + t.vy * 0.15 - r.y, t.x + t.vx * 0.15 - r.x); r.a += clamp(wrap(want - r.a), -3.6 * dt, 3.6 * dt); }
        r.sp = Math.min(650, r.sp + 200 * dt); r.vx = Math.cos(r.a) * r.sp; r.vy = Math.sin(r.a) * r.sp;
      }
      r.x += r.vx * dt; r.y += r.vy * dt;
      if (Math.random() < 0.85) parts.push({ x: r.x - Math.cos(r.a) * 9, y: r.y - Math.sin(r.a) * 9, vx: rand(-15, 15), vy: rand(-15, 15), life: 0.55, max: 0.55, kind: 'smoke', size: rand(3, 5) });
      r.idx = nearest(r.x, r.y, r.idx, 12);
      const p = track.pts[r.idx];
      let boom = r.life <= 0 || hyp(r.x - p.x, r.y - p.y) > WALL;
      if (!boom) for (const o of cars) if (o !== r.owner && !o.dead && hyp(o.x - r.x, o.y - r.y) < 18) { hurt(o, 9, r.owner); boom = true; break; }
      if (!boom) for (const pd of peds) if (hyp(pd.x - r.x, pd.y - r.y) < 10) { boom = true; break; }
      if (!boom) for (const b of bikers) if ((b.st === 'alive' || b.st === 'burning') && hyp(b.x - r.x, b.y - r.y) < 12) { boom = true; break; }
      if (!boom) for (const m of bikes) if (m.z < 10 && hyp(m.x - r.x, m.y - r.y) < 14) { boom = true; break; }
      if (boom) { rockets.splice(i, 1); explode(r.x, r.y, r.owner, r.kind === 'seeker' ? 0.9 : 1); }
    }

    // burning oil drums
    for (let i = drums.length - 1; i >= 0; i--) {
      const d = drums[i];
      d.fuse -= dt; d.arm -= dt; d.a += dt * 2;
      d.vx *= Math.pow(0.2, dt); d.vy *= Math.pow(0.2, dt); d.x += d.vx * dt; d.y += d.vy * dt;
      if (Math.random() < 0.5) parts.push({ x: d.x + rand(-4, 4), y: d.y + rand(-4, 4), vx: rand(-8, 8), vy: rand(-30, -10), life: 0.35, max: 0.35, kind: 'fire', size: rand(3, 6) });
      if (d.fuse <= 0 || d.arm <= 0 && cars.some(c => !c.dead && hyp(c.x - d.x, c.y - d.y) < 22)) { drums.splice(i, 1); drumBoom(d); }
    }

    // lakes of fire
    for (let i = fires.length - 1; i >= 0; i--) {
      const f = fires[i];
      f.t -= dt;
      if (f.t <= 0) { fires.splice(i, 1); continue; }
      if (Math.random() < 0.9) { const a = rand(0, 6.28), r = Math.sqrt(Math.random()) * f.r; parts.push({ x: f.x + Math.cos(a) * r, y: f.y + Math.sin(a) * r, vx: rand(-6, 6), vy: rand(-35, -12), life: 0.45, max: 0.45, kind: 'fire', size: rand(4, 9) }); }
      for (const c of cars) if (!c.dead && hyp(c.x - f.x, c.y - f.y) < f.r) { hurt(c, 4.5 * dt, f.owner); ignite(c, f.owner, 1.5); }
      for (let k = peds.length - 1; k >= 0; k--) if (hyp(peds[k].x - f.x, peds[k].y - f.y) < f.r) burnPed(k, f.owner);
    }

    // fire spreads to the gang
    for (const f of fires) {
      for (const b of bikers) if (hyp(b.x - f.x, b.y - f.y) < f.r) igniteBiker(b, f.owner);
      for (const m of bikes) if (!m.wrecked && m.fuse < 0 && hyp(m.x - f.x, m.y - f.y) < f.r * 0.8) { m.fuse = rand(1, 2.5); m.by = f.owner; }
    }
    updateGang(dt);

    // mines
    for (let i = mines.length - 1; i >= 0; i--) {
      const m = mines[i]; m.arm -= dt; m.t += dt;
      if (m.arm > 0) continue;
      if (cars.some(c => !c.dead && hyp(c.x - m.x, c.y - m.y) < 20)) { mines.splice(i, 1); explode(m.x, m.y, m.owner); }
    }

    // pedestrians
    if (live) { pedT -= dt; if (pedT <= 0 && peds.length < 14) { spawnPed(false); pedT = rand(1, 3); } }
    for (let i = peds.length - 1; i >= 0; i--) {
      const p = peds[i];
      let hitBy = null;
      for (const c of cars) if (!c.dead && hyp(c.vx, c.vy) > 55 && hyp(c.x - p.x, c.y - p.y) < 16) { hitBy = c; break; }
      if (hitBy) { killPed(i, Math.atan2(hitBy.vy, hitBy.vx), hitBy); continue; }
      let threat = null, td = 150;
      for (const c of cars) { const d = hyp(c.x - p.x, c.y - p.y); if (!c.dead && d < td && hyp(c.vx, c.vy) > 120) { td = d; threat = c; } }
      if (threat && p.st !== 'panic') { p.st = 'panic'; p.t = rand(0.6, 1.2); p.dir = Math.atan2(p.y - threat.y, p.x - threat.x) + rand(-1.3, 1.3); }
      let sp = 0;
      if (p.st === 'panic') { sp = 105; p.t -= dt; if (p.t < 0) { p.st = 'idle'; p.t = rand(1, 3); } }
      else if (p.st === 'cross') { const d = hyp(p.tx - p.x, p.ty - p.y); p.dir = Math.atan2(p.ty - p.y, p.tx - p.x); sp = 42; if (d < 4) { p.st = 'idle'; p.t = rand(2, 6); } }
      else if (live) {
        p.t -= dt;
        if (p.t < 0) {
          if (Math.random() < 0.4) { const q = track.pts[(p.idx + Math.floor(rand(-8, 8)) + track.N) % track.N]; p.side = -p.side; const off = p.side * rand(HALF + 14, WALL - 16); p.tx = q.x + q.nx * off; p.ty = q.y + q.ny * off; p.st = 'cross'; }
          else p.t = rand(1.5, 4);
        }
      }
      p.x += Math.cos(p.dir) * sp * dt; p.y += Math.sin(p.dir) * sp * dt; p.ph += sp * dt * 0.3;
      p.idx = nearest(p.x, p.y, p.idx, 8);
      const q = track.pts[p.idx], dx = p.x - q.x, dy = p.y - q.y, d = hyp(dx, dy);
      if (d > WALL - 8) { p.x = q.x + dx / d * (WALL - 8); p.y = q.y + dy / d * (WALL - 8); p.dir += Math.PI; }
    }

    // pickups
    for (const k of pickups) {
      if (!k.active) { k.t -= dt; if (k.t <= 0) { k.active = true; k.type = pick('$RANSS'); } continue; }
      for (const c of cars) {
        if (c.dead || hyp(c.x - k.x, c.y - k.y) > 24) continue;
        k.active = false; k.t = 12;
        if (k.type === 'R') c.hp = Math.min(100, c.hp + 30);
        if (k.type === 'A') c.ammo = Math.min(MAX_AMMO, c.ammo + 40);
        if (k.type === 'N') c.turbo = Math.min(100, c.turbo + 50);
        let spText = '';
        if (k.type === 'S') {
          const t = pick(SP_ORDER), add = { rocket: 2, seeker: 1, flame: 40, drum: 1 }[t];
          c.sp[t] = Math.min(SPECIALS[t].max, c.sp[t] + add);
          spText = `${SPECIALS[t].hud} +${add}`;
          if (c.isPlayer && !(c.sp[SP_ORDER[c.spSel]] > 0)) c.spSel = SP_ORDER.indexOf(t);
        }
        if (c.isPlayer) {
          if (k.type === '$') career.cash += 150;
          sfx.pickup();
          floats.push({ x: k.x, y: k.y - 14, text: { $: '+$150', R: 'REPAIR +30', A: 'AMMO +40', N: 'NITRO +50', S: spText }[k.type], life: 1, color: HAZ });
        }
        break;
      }
    }

    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.x += p.vx * dt; p.y += p.vy * dt;
      const fr = p.kind === 'smoke' ? 0.4 : 0.05; p.vx *= Math.pow(fr, dt); p.vy *= Math.pow(fr, dt);
      p.life -= dt;
      if (p.life <= 0) { if (p.kind === 'gib') { dctx.fillStyle = 'rgba(120,6,6,.8)'; dctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3); } parts.splice(i, 1); }
    }
    for (let i = floats.length - 1; i >= 0; i--) { const f = floats[i]; f.y -= 28 * dt; f.life -= dt; if (f.life <= 0) floats.splice(i, 1); }
    for (let i = msgs.length - 1; i >= 0; i--) { msgs[i].t -= dt; if (msgs[i].t <= 0) msgs.splice(i, 1); }

    // camera
    const tx = player.x + player.vx * 0.32, ty = player.y + player.vy * 0.32;
    cam.x += (tx - cam.x) * Math.min(1, dt * 5); cam.y += (ty - cam.y) * Math.min(1, dt * 5);
    shake = Math.max(0, shake - dt * 30);

    if (state === 'race' && (player.finished || player.dead)) { state = 'ending'; endT = player.dead ? 2.6 : 3; }
    if (state === 'ending') { endT -= dt; if (endT <= 0) endRace(); }
  }

  function updateAudio() {
    if (!eng) return;
    const on = player && (state === 'race' || state === 'count' || state === 'ending') && !player.dead;
    const f = 48 + Math.abs(player ? player.fwd : 0) * 0.26 + (player && held('turbo') && player.turbo > 0 ? 20 : 0);
    eng.o1.frequency.setTargetAtTime(f, ac.currentTime, 0.06);
    eng.o2.frequency.setTargetAtTime(f * 0.501, ac.currentTime, 0.06);
    eng.g.gain.setTargetAtTime(on ? 0.06 : 0, ac.currentTime, 0.08);
  }

  // ================= render =================
  function drawCar(c) {
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.a);
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(-15, -7, 34, 18);
    ctx.fillStyle = '#0d0d0d';
    ctx.fillRect(-14, -11, 9, 4); ctx.fillRect(-14, 7, 9, 4); ctx.fillRect(7, -11, 9, 4); ctx.fillRect(7, 7, 9, 4);
    ctx.fillStyle = c.dead ? '#2a2522' : c.flash > 0 ? '#fff' : c.color;
    ctx.beginPath(); ctx.roundRect(-18, -8, 36, 16, 4); ctx.fill();
    if (!c.dead) {
      ctx.fillStyle = c.accent; ctx.fillRect(4, -2, 13, 4); ctx.fillRect(-17, -8, 3, 16);
      ctx.fillStyle = '#18242c'; ctx.fillRect(0, -6, 6, 12); ctx.fillRect(-11, -5, 4, 10);
      ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(-7, -6, 7, 12);
      ctx.fillStyle = '#444'; ctx.fillRect(6, -1.5, 14, 3);
      if (c.flameT > 0) { ctx.fillStyle = 'rgba(255,160,40,.85)'; ctx.beginPath(); ctx.arc(21, 0, 4 + Math.random() * 2, 0, 7); ctx.fill(); }
      ctx.fillStyle = '#fff6c2'; ctx.fillRect(16, -7, 2, 3); ctx.fillRect(16, 4, 2, 3);
      if (c.muzzle > 0) { ctx.fillStyle = '#ffe36b'; ctx.beginPath(); ctx.moveTo(20, 0); ctx.lineTo(32, -5); ctx.lineTo(29, 0); ctx.lineTo(32, 5); ctx.closePath(); ctx.fill(); }
    } else { ctx.fillStyle = '#120f0d'; ctx.fillRect(-10, -6, 16, 12); }
    ctx.restore();
  }
  function drawPed(p) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.dir);
    const l = Math.sin(p.ph) * 3.5;

        <dt>Rival drivers</dt><dd>Grimm, Vex and Mad Dog</dd>
        <dt>Inspired by</dt><dd>Death Rally (Remedy Entertainment, 1996)</dd>
        <dt>Source</dt><dd>github.com/fsaritome/CarnageCircuit</dd>
      </dl>
      <p class="lede">No spectators were harmed outside of this browser tab.</p>
      <div class="row"><button class="go" data-act="title">Back</button></div>
    </div>`);
  }

  function garage() {
    state = 'garage'; save();
    const k = career, T = TRACKS[k.race % TRACKS.length];
    const repairCost = Math.ceil((100 - k.hp) * 7), ammoCost = (MAX_AMMO - k.ammo) * 2, mineCost = 300;
    const ups = Object.entries(UP).map(([key, u]) => {
      const lvl = k[key], max = u.cost.length, cost = u.cost[lvl];
      const pips = Array.from({ length: max }, (_, i) => `<i class="${i < lvl ? 'on' : ''}"></i>`).join('');
      const btn = lvl >= max ? '<button disabled>Maxed</button>' : `<button data-act="up:${key}" ${k.cash < cost ? 'disabled' : ''}>Buy ${money(cost)}</button>`;
      return `<div class="up"><span class="nm">${u.label}</span>${btn}<div class="pips">${pips}</div><span class="ds">${u.desc}</span></div>`;
    }).join('');
    const table = Object.entries(k.pts).sort((a, b) => b[1] - a[1]).map(([n, p], i) =>
      `<tr class="${n === 'You' ? 'me' : ''}"><td>${i + 1}</td><td>${dot(colorOf(n))}${n}</td><td class="n">${p}</td></tr>`).join('');
    const specials = SP_ORDER.map(t => {
      const s = SPECIALS[t], have = Math.ceil(k.sp[t]), full = have >= s.max;
      return `<div class="up"><span class="nm">${s.label} · ${have}/${s.max}</span>
        <button data-act="sp:${t}" ${full || k.cash < s.cost ? 'disabled' : ''}>${full ? 'Full' : `+${s.pack} for ${money(s.cost)}`}</button>
        <span class="ds">${s.desc}</span></div>`;
    }).join('');
    showPanel(`<div class="stack">
      <div class="g-head">
        <div><p class="eyebrow">Garage · race ${k.race + 1} of ${RACES} · ${LAPS} laps · ${diffOf().label}</p><h2>Next: ${T.name}</h2></div>
        <div class="cash">${money(k.cash)}</div>
      </div>
      <div class="hazard"></div>
      <div class="g-grid">
        <section class="card"><h3>Upgrades</h3>${ups}</section>
        <section class="card"><h3>Special weapons</h3>${specials}
          <p class="ds" style="margin-top:8px">In the race: E fires the selected special, Q switches.</p></section>
        <section class="card">
          <h3>Workshop</h3>
          <div class="up"><span class="nm">Armor ${Math.ceil(k.hp)}%</span>
            <button data-act="repair" ${k.hp >= 100 || k.cash < 1 ? 'disabled' : ''}>${k.hp >= 100 ? 'Intact' : 'Repair ' + money(Math.min(repairCost, k.cash))}</button>
            <div class="meter ${k.hp < 40 ? 'bad' : ''}"><span style="width:${k.hp}%"></span></div></div>
          <div class="up"><span class="nm">Ammo ${k.ammo} / ${MAX_AMMO}</span>
            <button data-act="ammo" ${k.ammo >= MAX_AMMO || k.cash < 2 ? 'disabled' : ''}>${k.ammo >= MAX_AMMO ? 'Full' : 'Refill ' + money(Math.min(ammoCost, Math.floor(k.cash / 2) * 2))}</button>
            <span class="ds">$2 per round</span></div>
          <div class="up"><span class="nm">Mines ${k.mines} / ${MAX_MINES}</span>
            <button data-act="mines" ${k.mines >= MAX_MINES || k.cash < mineCost ? 'disabled' : ''}>+3 for ${money(mineCost)}</button>
            <span class="ds">Arms 0.7s after dropping</span></div>
          <h3 style="margin-top:14px">Rival difficulty</h3>
          ${diffPicker(k.diff || 'normal')}
          <p class="ds" style="margin-top:6px">Takes effect from the next race.</p>
          <h3 style="margin-top:14px">Championship</h3>
          <table><thead><tr><th>#</th><th>Driver</th><th class="n">Pts</th></tr></thead><tbody>${table}</tbody></table>
        </section>
      </div>
      <div class="row"><button class="go" data-act="race">Start race</button><button data-act="title">Save and quit</button></div>
    </div>`);
  }

  function endRace() {
    const st = standings(), k = career, mult = 1 + k.race * 0.3;
    const rows = st.map((c, i) => {
      const prize = c.dead ? 0 : Math.round(PRIZE[i] * mult / 10) * 10, pts = c.dead ? 0 : POINTS[i];
      k.pts[c.name] = (k.pts[c.name] || 0) + pts;
      return { c, i, prize, pts };
    });
    const me = rows.find(r => r.c.isPlayer), bonus = player.kills * KILL_BONUS;
    k.cash += me.prize + bonus;
    k.hp = player.dead ? 10 : Math.max(10, Math.ceil(player.hp));
    k.ammo = player.ammo; k.mines = player.mines; k.sp = { ...player.sp, flame: Math.floor(player.sp.flame) };
    k.race++;
    save();
    state = 'results';
    const last = k.race >= RACES;
    showPanel(`<div class="stack">
      <p class="eyebrow">${track.T.name} · race ${k.race} of ${RACES}</p>
      <div class="row" style="gap:18px;align-items:flex-end">
        <span class="big-place ${player.dead ? 'dead' : ''}">${player.dead ? 'WRECKED' : ordinal(me.i + 1).toUpperCase()}</span>
        <p class="lede">${player.dead ? 'No prize money for wrecks. The crew patched the car to 10% armor.' : me.i === 0 ? 'Checkered flag. The crowd that survived is cheering.' : 'Finished and paid.'}</p>
      </div>
      <div class="card"><table>
        <thead><tr><th>#</th><th>Driver</th><th>Status</th><th class="n">Prize</th><th class="n">Pts</th></tr></thead>
        <tbody>${rows.map(r => `<tr class="${r.c.isPlayer ? 'me' : ''}"><td>${r.i + 1}</td><td>${dot(r.c.isPlayer ? HAZ : r.c.color)}${r.c.name}</td><td>${r.c.dead ? '<span class="dead">Wrecked</span>' : r.c.finished ? 'Finished' : 'Running'}</td><td class="n">${money(r.prize)}</td><td class="n">${r.pts}</td></tr>`).join('')}</tbody>
      </table></div>
      <p class="lede">Your kills: ${player.kills} × ${money(KILL_BONUS)} = ${money(bonus)} · Cash now ${money(k.cash)}</p>
      <div class="row"><button class="go" data-act="${last ? 'champ' : 'garage'}">${last ? 'Final standings' : 'To the garage'}</button></div>
    </div>`);
  }

  function champScreen() {
    state = 'champ';
    const table = Object.entries(career.pts).sort((a, b) => b[1] - a[1]);
    const won = table[0][0] === 'You';
    showPanel(`<div class="stack">
      <div class="hazard"></div>
      <p class="eyebrow">Championship over</p>
      <h1>${won ? 'CHAMPION' : table[0][0].toUpperCase() + ' TAKES IT'}</h1>
      <p class="lede">${won ? 'Six races, one survivor at the top. Your name goes on the trophy.' : 'You finished ' + ordinal(table.findIndex(t => t[0] === 'You') + 1) + ' overall. Upgrade earlier and keep your armor up.'}</p>
      <div class="card"><table><thead><tr><th>#</th><th>Driver</th><th class="n">Points</th></tr></thead>
      <tbody>${table.map(([n, p], i) => `<tr class="${n === 'You' ? 'me' : ''}"><td>${i + 1}</td><td>${dot(colorOf(n))}${n}</td><td class="n">${p}</td></tr>`).join('')}</tbody></table></div>
      <div class="row"><button class="go" data-act="new">New championship</button><button data-act="credits">Credits</button><button data-act="title">Title screen</button></div>
      <p class="byline">Carnage Circuit · a game by <b>fsaritome</b></p>
    </div>`);
  }

  let pausedFrom = null;
  function togglePause() {
    if (state === 'race' || state === 'count' || state === 'ending') {
      pausedFrom = state; state = 'paused';
      showPanel(`<div class="stack" style="align-items:flex-start"><h2>PAUSED</h2><div class="row"><button class="go" data-act="resume">Resume</button><button data-act="quit">Quit race (counts as wrecked)</button></div></div>`);
    } else if (state === 'paused') { state = pausedFrom; showPanel(null); initAudio(); }
  }
  $('bPause').onclick = togglePause;

  panel.addEventListener('click', e => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    initAudio();
    const act = b.dataset.act, k = career;
    if (act === 'new') { career = freshCareer(); garage(); }
    else if (act === 'continue') { career = load() || freshCareer(); career.sp = Object.assign(noSpecials(), career.sp); career.race >= RACES ? champScreen() : garage(); }
    else if (act.startsWith('sp:')) {
      const t = act.slice(3), s = SPECIALS[t];
      if (s && k.cash >= s.cost && k.sp[t] < s.max) { k.cash -= s.cost; k.sp[t] = Math.min(s.max, k.sp[t] + s.pack); sfx.pickup(); }
      garage();
    }
    else if (act === 'title') { save(); titleScreen(); }
    else if (act === 'race') setupRace();
    else if (act === 'garage') garage();
    else if (act === 'champ') champScreen();
    else if (act === 'credits') creditsScreen();
    else if (act.startsWith('diff:')) {
      const key = act.slice(5);
      if (DIFF[key]) {
        pickedDiff = key; try { localStorage.setItem('carnage-circuit-diff' + CHANNEL, key); } catch (_) {}
        if (state === 'garage') { k.diff = key; garage(); }
        else panel.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
      }
    }
    else if (act === 'resume') togglePause();
    else if (act === 'quit') { state = pausedFrom; player.hp = 0; player.dead = true; player.deadT = raceT; endRace(); }
    else if (act.startsWith('up:')) { const key = act.slice(3), cost = UP[key].cost[k[key]]; if (cost && k.cash >= cost) { k.cash -= cost; k[key]++; sfx.pickup(); } garage(); }
    else if (act === 'repair') { const need = Math.ceil((100 - k.hp) * 7), pay = Math.min(need, k.cash); k.hp = Math.min(100, k.hp + pay / 7); if (pay >= need) k.hp = 100; k.cash -= pay; garage(); }
    else if (act === 'ammo') { const n = Math.min(MAX_AMMO - k.ammo, Math.floor(k.cash / 2)); k.ammo += n; k.cash -= n * 2; garage(); }
    else if (act === 'mines') { if (k.cash >= 300) { k.cash -= 300; k.mines = Math.min(MAX_MINES, k.mines + 3); } garage(); }
  });

  // ================= attract mode behind the title =================
  function attract() {
    career = freshCareer();
    track = buildTrack(0);
    decal = document.createElement('canvas'); decal.width = track.WW; decal.height = track.WH; dctx = decal.getContext('2d');
    const N = track.N;
    cars = RIVALS.map((d, i) => makeCar(d, { hp: 100, eng: 2, tire: 2, armor: 0, gun: 1, ammo: 999, mines: 0, spd: 0.95, skill: 1 }, (Math.floor(N * 0.1) + i * 30) % N, (i - 1) * 25));
    player = makeCar(ME, { hp: 100, eng: 2, tire: 2, armor: 0, gun: 1, ammo: 0, mines: 0, spd: 1 }, (Math.floor(N * 0.1) + 95) % N, 0);
    player.finished = true; cars.push(player);
    peds = []; for (let i = 0; i < 14; i++) spawnPed(true);
    pickups = []; bullets = []; mines = []; parts = []; floats = []; msgs = []; finishOrder = [];
    resetWeapons();
    cam.x = player.x; cam.y = player.y; raceT = 0;
  }
  function attractUpdate(dt) {
    raceT += dt;
    for (const c of cars) {
      const ctl = aiControl(c, dt); ctl.fire = false; ctl.mine = false;
      drive(c, ctl, dt); c.x += c.vx * dt; c.y += c.vy * dt; trackClamp(c, 14);
    }
    for (let i = peds.length - 1; i >= 0; i--) {
      const p = peds[i];
      for (const c of cars) if (hyp(c.vx, c.vy) > 55 && hyp(c.x - p.x, c.y - p.y) < 16) { bloodSplat(p.x, p.y, Math.atan2(c.vy, c.vx), 14); peds.splice(i, 1); c.bloodT = 2; break; }
    }
    if (peds.length < 10) spawnPed(false);
    cam.x += (player.x - cam.x) * Math.min(1, dt * 3); cam.y += (player.y - cam.y) * Math.min(1, dt * 3);
  }

  attract();
  titleScreen();

  let last = 0;
  function frame(ts) {
    const dt = Math.min(0.033, last ? (ts - last) / 1000 : 0); last = ts;
    if (state === 'race' || state === 'count' || state === 'ending') update(dt);
    else if (state === 'title' || state === 'credits') attractUpdate(dt);
    updateAudio();
    if (state === 'title' || state === 'credits' || state === 'paused' || state === 'race' || state === 'count' || state === 'ending') render();
    else if (state === 'garage' || state === 'results' || state === 'champ') render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
